name: "Autonomous Macro Regime Monitor"

on:
  schedule:
    # GitHub Actions cron UTC kullanır.
    # Runner her 2 saatte bir çalışır; kalıcı state/audit en az günde 1 kez yazılır.
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: macro-model-autonomous-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autonomous-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "Repository Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: "Python Setup"
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: "Install Headless Monitor Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: "Run Autonomous Regime Scan + Persist State"
        env:
          PYTHONUNBUFFERED: "1"
        # Logic moved from this YAML into autonomous_monitor.py (v2.4) so it
        # can be tested and shares the app's asset-signal engine.
        run: python autonomous_monitor.py

      - name: "Wake Streamlit App"
        run: |
          echo "Streamlit uygulaması için canlı HTTP wakeup gönderiliyor..."
          STATUS_CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "https://vdthz.streamlit.app/?autonomous_check=$(date +%s)" || echo "000")
          echo "HTTP Yanıt Kodu: $STATUS_CODE"
          case "$STATUS_CODE" in
            200|302|304)
              echo "✅ Streamlit erişilebilir."
              ;;
            *)
              echo "⚠️ Streamlit yanıtı beklenen kod değil: $STATUS_CODE"
              ;;
          esac

      - name: "Commit Autonomous State"
        run: |
          if git diff --quiet -- backtest_summary.json; then
            echo "ℹ️ Persist edilecek değişiklik yok."
            exit 0
          fi

          git config user.name "macro-model-autonomous-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_summary.json
          git commit -m "chore: persist autonomous macro regime state"
          # the weekly validation job may push in between -> rebase, retry
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
